<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .message {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);

    .message h1 {
      font-size: 32px;
      color: #27ae60;
      margin-bottom: 10px;
    }
    .message p {
      font-size: 18px;
      color: #333;
    }
    .message a {
      display: inline-block;
      margin-top: 20px;
      background: #27ae60;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

<body>
  <div class="message">
    <h1>Thank You!</h1>
    <p>Your message has been received. I will get back to you soon.</p>
    <a href="index.html">← Back to Portfolio</a>
